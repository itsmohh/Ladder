name: Scrape Jobs

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "ERROR: SUPABASE_URL secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SECRET_KEY }}" ]; then
            echo "ERROR: SUPABASE_SECRET_KEY secret is not set!"
            exit 1
          fi
          echo "Both secrets are configured."

      - name: Run job scraping pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -e
          python -u run_pipeline.py --cleanup 2>&1 | tee pipeline.log
          
      - name: Show error details on failure
        if: failure()
        run: |
          echo "=== Pipeline Log ==="
          cat pipeline.log 2>/dev/null || echo "No pipeline.log found"
          echo ""
          echo "=== Last 50 lines of any CSV errors ==="
          tail -50 *.log 2>/dev/null || echo "No additional logs"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            *.log
            data/*.csv
          retention-days: 7
